<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
  <style>
    path {
      stroke-dasharray: 1 2;
      stroke-dashoffset: 1;
      opacity: 0;
      animation:
        fingerprint-draw 5s infinite,
        fingerprint-fade 5s infinite;
    }

    @keyframes fingerprint-draw {
      0%, 2%   { stroke-dashoffset: 1; animation-timing-function: cubic-bezier(0.2, 0.7, 0.3, 1); }
      42%, 80% { stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0.5, 0, 0.75, 0.5); }
      96%, 100% { stroke-dashoffset: 1; }
    }

    @keyframes fingerprint-fade {
      0%       { opacity: 0; }
      2%       { opacity: 1; }
      96%      { opacity: 1; }
      100%     { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      path { animation: none; stroke-dashoffset: 0; opacity: 1; }
    }
  </style>
  <g stroke="#0c7868" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path pathLength="1" d="M13.1 21c-2.3-1.5-3.8-4-3.8-7 0-1.5 1.2-2.8 2.7-2.8s2.7 1.3 2.7 2.8 1.2 2.7 2.7 2.7 2.7-1.2 2.7-2.7C20.3 9.4 16.6 5.7 12 5.7S3.8 9.4 3.8 14c0 1 .1 2 .3 3" />
    <path pathLength="1" d="M8.5 20.3A10.9 10.9 0 0 1 6.5 14c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5" />
    <path pathLength="1" d="M17.8 19.5h-.3a5.5 5.5 0 0 1-5.5-5.5" />
    <path pathLength="1" d="M19.7 6.5A10.9 10.9 0 0 0 12 3 10.9 10.9 0 0 0 4.3 6.5" />
  </g>
</svg>